const list=document.getElementById("list");
const video=document.getElementById("video");
const source=document.getElementById("source");
const title=document.getElementById("title");
const search=document.getElementById("search");

function load(arr){
    list.innerHTML="";
    arr.forEach(v=>{
        const div=document.createElement("div");
        div.className="item";
        div.textContent=v.title;

        div.onclick=()=>{
            source.src=v.file;
            video.load();
            video.play();
            title.textContent=v.title;
        };

        list.appendChild(div);
    });
}

search.addEventListener("input",()=>{
    const keyword=search.value.toLowerCase();
    load(videos.filter(v=>v.title.toLowerCase().includes(keyword)));
});

load(videos);
function playRandom(){
    const random=Math.floor(Math.random()*videos.length);
    const v=videos[random];

    source.src=v.file;
    video.load();
    video.play();
    title.textContent=v.title;
}

document.getElementById("randomBtn").onclick=playRandom;

// Tự phát bài ngẫu nhiên tiếp theo khi hết bài
video.addEventListener("ended",playRandom);
