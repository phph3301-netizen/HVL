<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVL Media</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
height:100vh;
overflow:hidden;
}

button,input{
font-family:inherit;
}

#home{
display:flex;
justify-content:center;
align-items:center;
gap:30px;
height:100vh;
padding:30px;
flex-wrap:wrap;
}

.album{
width:260px;
background:#1f1f1f;
border-radius:18px;
padding:20px;
cursor:pointer;
transition:.25s;
text-align:center;
}

.album:hover{
transform:scale(1.04);
background:#2a2a2a;
}

.album img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:14px;
margin-bottom:15px;
}

.album h2{
margin-bottom:8px;
}

.album p{
opacity:.7;
}

#app{
display:none;
height:100vh;
display:flex;
}

#player{
flex:3;
display:flex;
flex-direction:column;
padding:20px;
}

video{
width:100%;
height:70vh;
background:#000;
border-radius:12px;
}

#audio{
display:none;
width:100%;
margin-top:10px;
}

#title{
margin:15px 0;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.controls button{
padding:10px 16px;
border:none;
border-radius:8px;
background:#333;
color:white;
cursor:pointer;
}

.controls button:hover{
background:#555;
}

#sidebar{
flex:1;
background:#1a1a1a;
padding:15px;
overflow-y:auto;
}

#search{
width:100%;
padding:10px;
border:none;
border-radius:8px;
margin-bottom:15px;
}

.item{
padding:12px;
background:#2b2b2b;
border-radius:8px;
margin-bottom:8px;
cursor:pointer;
transition:.2s;
}

.item:hover{
background:#444;
}

@media(max-width:900px){

#app{
flex-direction:column;
}

video{
height:38vh;
}

#sidebar{
height:40vh;
}

}
</style>
</head>

<body>

<div id="home">

<div class="album" onclick="openAlbum('HVL')">
<img src="HVL.jpg">
<h2>HVL</h2>
<p>30 bài - 90 phút</p>
</div>

<div class="album" onclick="openAlbum('99%')">
<img src="99.jpg">
<h2>99%</h2>
<p>16 bài - 40 phút</p>
</div>

</div>

<div id="app">

<div id="player">

<video id="video" controls playsinline webkit-playsinline preload="auto">
<source id="videoSource">
</video>

<audio id="audio" controls>
<source id="audioSource">
</audio>

<h2 id="title">Chọn bài hát</h2>

<div class="controls">

<button onclick="backHome()">🏠 Album</button>

<button onclick="prevSong()">⏮</button>

<button id="randomBtn">🎲</button>

<button onclick="nextSong()">⏭</button>

</div>

</div>

<div id="sidebar">

<input id="search" placeholder="Tìm kiếm...">

<div id="list"></div>

</div>

</div>

<script>

{id:"15",title:"Suit & Tie",file:"YTDown.com_YouTube_03-Suit-_-Tie-RPT-MCK-ft-Hoang-Ton-99-th_Media_1jTSZWRFEB8_001_1080p.mp4"}, 
{id:"16",title:"Va Vào Giai Điệu Này",file:"YTDown.com_YouTube_04-Va-Vao-Giai-Dieu-Nay-RPT-MCK-99-the-a_Media_M7UlJ0m-yy4_001_1080p.mp4"},

]
}

};

let currentAlbum = "";
let currentSongs = [];
let currentIndex = -1;

const home = document.getElementById("home");
const app = document.getElementById("app");

const list = document.getElementById("list");

const video = document.getElementById("video");
const videoSource = document.getElementById("videoSource");

const audio = document.getElementById("audio");
const audioSource = document.getElementById("audioSource");

const title = document.getElementById("title");

const search = document.getElementById("search");

function openAlbum(name){

currentAlbum = name;
currentSongs = albums[name].songs;

home.style.display="none";
app.style.display="flex";

search.value="";

currentIndex = -1;
renderList(currentSongs);

}

function backHome(){

video.pause();
audio.pause();

home.style.display="flex";
app.style.display="none";

}

function renderList(arr){

list.innerHTML="";

arr.forEach((song,index)=>{

const div=document.createElement("div");

div.className="item";

div.textContent=song.title;

div.onclick = () => {

currentIndex = currentSongs.findIndex(s => s.file === song.file);

playSong(currentIndex);

};

list.appendChild(div);

});

}

function playSong(index){

currentIndex=index;

const song=currentSongs[index];

title.textContent=song.title;

const file=song.file.toLowerCase();

video.pause();
audio.pause();

if(file.endsWith(".mp4")){

audio.style.display="none";
video.style.display="block";

videoSource.src=song.file;

video.load();

video.play();

}else{

video.style.display="none";
audio.style.display="block";

audioSource.src=song.file;

audio.load();

audio.play();

}

}
search.addEventListener("input",()=>{

const keyword=search.value.toLowerCase();

renderList(

currentSongs.filter(song=>

song.title.toLowerCase().includes(keyword)

)

);

});

function playRandom(){

if(currentSongs.length===0) return;

const random=Math.floor(Math.random()*currentSongs.length);

playSong(random);

}

document.getElementById("randomBtn").onclick=playRandom;

function nextSong(){

if(currentSongs.length===0) return;

currentIndex++;

if(currentIndex>=currentSongs.length){

currentIndex=0;

}

playSong(currentIndex);

}

function prevSong(){

if(currentSongs.length===0) return;

currentIndex--;

if(currentIndex<0){

currentIndex=currentSongs.length-1;

}

playSong(currentIndex);

}

video.addEventListener("ended",nextSong);

audio.addEventListener("ended",nextSong);
</script>

</body>
</html>
